[project]
name = "vault"
version = "0.1.0"
description = "Catalog-scale archive delivery triage: machine-measured, not estimated"
requires-python = ">=3.13"
readme = "README.md"
license = {text = "MIT"}
dependencies = [
    "aiohttp>=3.14.3",
    "clickhouse-connect>=1.8.0",
    "fastapi[standard]>=0.141.1",
    "google-adk>=2.8.0",
    "google-genai>=2.22.0",
    "mcp>=1.24,<2",
    "python-dotenv>=1.2.3",
    "uvicorn>=0.52.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
